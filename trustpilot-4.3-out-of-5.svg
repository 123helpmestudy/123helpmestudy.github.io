<svg xmlns="http://www.w3.org/2000/svg"
     width="752" height="408" viewBox="0 0 376 204"
     role="img" aria-labelledby="title desc">
  <title id="title">Trustpilot rating 4.3 out of 5</title>
  <desc id="desc">Trustpilot wordmark with four full green rating stars and a fifth tile filled to 30 percent.</desc>

  <rect width="376" height="204" fill="#FFFFFF"/>

  <!-- Trustpilot brand mark -->
  <polygon points="81.00,25.00 89.52,47.27 113.34,48.49 94.79,63.48 100.98,86.51 81.00,73.50 61.02,86.51 67.21,63.48 48.66,48.49 72.48,47.27" fill="#00B67A"/>
  <text x="120" y="80"
        font-family="Arial, Helvetica, sans-serif"
        font-size="41"
        font-weight="700"
        letter-spacing="-1.8"
        fill="#111111">Trustpilot</text>

  <!-- Rating tiles -->
  <g transform="translate(50 101)">
    <!-- Star 1 -->
    <g transform="translate(0 0)">
      <rect width="50" height="48" fill="#00B67A"/>
      <polygon points="25.00,7.50 29.41,18.93 41.64,19.59 32.13,27.32 35.29,39.16 25.00,32.50 14.71,39.16 17.87,27.32 8.36,19.59 20.59,18.93" transform="translate(0 -1)" fill="#FFFFFF"/>
    </g>

    <!-- Star 2 -->
    <g transform="translate(55 0)">
      <rect width="50" height="48" fill="#00B67A"/>
      <polygon points="25.00,7.50 29.41,18.93 41.64,19.59 32.13,27.32 35.29,39.16 25.00,32.50 14.71,39.16 17.87,27.32 8.36,19.59 20.59,18.93" transform="translate(0 -1)" fill="#FFFFFF"/>
    </g>

    <!-- Star 3 -->
    <g transform="translate(110 0)">
      <rect width="50" height="48" fill="#00B67A"/>
      <polygon points="25.00,7.50 29.41,18.93 41.64,19.59 32.13,27.32 35.29,39.16 25.00,32.50 14.71,39.16 17.87,27.32 8.36,19.59 20.59,18.93" transform="translate(0 -1)" fill="#FFFFFF"/>
    </g>

    <!-- Star 4 -->
    <g transform="translate(165 0)">
      <rect width="50" height="48" fill="#00B67A"/>
      <polygon points="25.00,7.50 29.41,18.93 41.64,19.59 32.13,27.32 35.29,39.16 25.00,32.50 14.71,39.16 17.87,27.32 8.36,19.59 20.59,18.93" transform="translate(0 -1)" fill="#FFFFFF"/>
    </g>

    <!-- Star 5: 30% green = 4.3 / 5 -->
    <g transform="translate(220 0)">
      <rect width="50" height="48" fill="#DCDCE6"/>
      <rect width="15" height="48" fill="#00B67A"/>
      <polygon points="25.00,7.50 29.41,18.93 41.64,19.59 32.13,27.32 35.29,39.16 25.00,32.50 14.71,39.16 17.87,27.32 8.36,19.59 20.59,18.93" transform="translate(0 -1)" fill="#FFFFFF"/>
    </g>
  </g>
</svg>
